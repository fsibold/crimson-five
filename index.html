<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}[hidden]{display:none!important}</style>
</head>
<body>
<title>Crimson Five</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one centered column — header, timer bar, grid, active-clue bar, clue lists */
:root{
  --bg:#f8ecee; --fg:#2b0a12; --muted:#7a4b54; --line:#a51c30;
  --crimson:#a51c30; --cell:#ffffff; --block:#2a1d20;
  --hi:#f2c4cc; --cur:#a51c30; --ok:#2f7d4f; --bad:#c2410c;
  --display:"Fraunces",Georgia,serif; --body:"Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1f0a0f; --fg:#f8e8eb; --muted:#c99aa3; --line:#e0566a;
  --crimson:#e0566a; --cell:#251b1e; --block:#000; --hi:#5a1a27; --cur:#c4304a; --ok:#5fbf86; --bad:#f08a5d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1f0a0f; --fg:#f8e8eb; --muted:#c99aa3; --line:#e0566a;
  --crimson:#e0566a; --cell:#251b1e; --block:#000; --hi:#5a1a27; --cur:#c4304a; --ok:#5fbf86; --bad:#f08a5d; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px}
.wrap{max-width:560px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
header{display:grid;gap:4px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--crimson);font-weight:600}
h1{font-family:var(--display);font-weight:800;font-size:40px;margin:0;line-height:1;text-wrap:balance}
.sub{color:var(--muted);margin:0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.timer{font-variant-numeric:tabular-nums;font-weight:600;font-size:18px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:13px;font-weight:600;padding:7px 12px;border-radius:6px;border:1.5px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
button:hover{background:var(--hi)}
button:focus-visible{outline:3px solid var(--cur);outline-offset:2px}
.grid{display:grid;width:100%;max-width:520px;justify-self:center;gap:3px}
.c{position:relative;background:var(--cell);box-shadow:0 0 0 1.5px var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:600;font-size:clamp(15px,5vw,28px);cursor:pointer;user-select:none;text-transform:uppercase}
.c.blk{background:transparent;box-shadow:none;cursor:default}
.c.word{background:var(--hi)}
.c.cur{background:var(--cur);color:#fff}
.c.cur .n{color:#fff}
header{background:var(--crimson);color:#fff;padding:22px 20px;border-radius:10px}
header .eyebrow,header .sub{color:#fff;opacity:.9}
button{border-color:var(--crimson);color:var(--crimson)}
#check{background:var(--crimson);color:#fff}
.timer{color:var(--crimson)}
.lists h2{color:var(--crimson)!important}
.c .n{position:absolute;top:1px;left:3px;font-family:var(--body);font-size:clamp(8px,2.2vw,11px);font-weight:600}
.c.wrong{color:var(--bad)}
.c.wrong::after{content:"";position:absolute;inset:auto 0 0 auto;width:0;height:0;border-left:12px solid transparent;border-bottom:12px solid var(--bad)}
.c.rev{color:var(--crimson)}
.clue-now{background:var(--hi);border-left:4px solid var(--crimson);padding:12px 14px;border-radius:4px;font-weight:500;min-height:22px;display:flex;align-items:center;gap:10px}
.clue-now b{font-family:var(--display)}
.lists{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:480px){.lists{grid-template-columns:1fr}}
.lists h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 6px;color:var(--muted)}
.lists ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.lists li{padding:6px 8px;border-radius:4px;cursor:pointer;display:grid;grid-template-columns:22px 1fr;gap:4px;min-width:0}
.lists li.on{background:var(--hi)}
.lists li.done{color:var(--muted);text-decoration:line-through}
.win{border:2px solid var(--ok);color:var(--ok);padding:14px;border-radius:6px;font-weight:600;text-align:center}
#kb{position:absolute;opacity:0;width:1px;height:1px;left:-10px}
@media (prefers-reduced-motion:no-preference){.c{transition:background .12s}}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">A crossword for people who know the Yard</div>
    <h1>Crimson Five</h1>
    <p class="sub">Deep-cut Harvard trivia, from the Square to the scandals. Tap a square, type, and tap again to switch direction.</p>
  </header>
  <div class="bar">
    <div class="timer" id="timer">0:00</div>
    <div class="btns">
      <button id="check">Check</button>
      <button id="reveal">Reveal</button>
      <button id="reset">Start over</button>
    </div>
  </div>
  <div class="grid" id="grid" role="grid" aria-label="Crossword grid"></div>
  <input id="kb" autocomplete="off" autocapitalize="characters" aria-label="Type a letter">
  <div class="clue-now" id="now"></div>
  <div class="win" id="win" hidden></div>
  <div class="lists">
    <div><h2>Across</h2><ol id="across"></ol></div>
    <div><h2>Down</h2><ol id="down"></ol></div>
  </div>
</div>

<script>
const SOL=["###I##GAY","###O#W#D#","###PRIMAL","##Q##D#M#","#SUMMERS#","##I##N##F","JANA#E##L","##C##REMY","FLYBY####"];
const ANS={
  GAY:"Claudine ___, president who resigned in January 2024",
  PRIMAL:"___ Scream (the midnight lap around the Yard before finals)",
  SUMMERS:"Larry ___, Harvard's most controversial ex-president",
  JANA:"Infamous fake Harvard freshman",
  REMY:"Famous Harvard pet who rules the Square",
  FLYBY:"Grab-and-go lunch for students who can't make it to the House",
  QUINCY:"River House between Lowell and Leverett",
  IOP:"Kennedy School club caught up in a recent scandal: Abbr.",
  WIDENER:"Library with the famous steps facing Mem Church",
  ADAMS:"Gold Coast House named for a family of presidents",
  FLY:"___ Club (a final club)"
};
const N=SOL.length,M=SOL[0].length,g=document.getElementById('grid'),kb=document.getElementById('kb');
g.style.gridTemplateColumns=`repeat(${M},1fr)`;g.style.aspectRatio=M+'/'+N;
const blk=(r,c)=>r<0||c<0||r>=N||c>=M||SOL[r][c]==='#';
const CLUES={A:{},D:{}};
let val=[...Array(N)].map(()=>Array(N).fill('')),num={},words={A:{},D:{}},cellWord={};
let n=0;
for(let r=0;r<N;r++)for(let c=0;c<M;c++){if(blk(r,c))continue;
  const a=blk(r,c-1)&&!blk(r,c+1),d=blk(r-1,c)&&!blk(r+1,c);
  if(a||d){n++;num[r+','+c]=n;
    if(a){const w=[];for(let x=c;!blk(r,x);x++)w.push([r,x]);words.A[n]=w}
    if(d){const w=[];for(let y=r;!blk(y,c);y++)w.push([y,c]);words.D[n]=w}}}
for(const d of ['A','D'])for(const k in words[d])CLUES[d][k]=ANS[words[d][k].map(([r,c])=>SOL[r][c]).join('')]||'?';
for(const dir of ['A','D'])for(const k in words[dir])words[dir][k].forEach(([r,c])=>{(cellWord[r+','+c]??={})[dir]=+k});
const cells=[];
for(let r=0;r<N;r++){cells[r]=[];for(let c=0;c<M;c++){const e=document.createElement('div');e.className='c'+(blk(r,c)?' blk':'');
  if(!blk(r,c)){e.innerHTML=(num[r+','+c]?`<span class="n">${num[r+','+c]}</span>`:'')+'<span class="v"></span>';
    e.onclick=()=>{if(cur.r===r&&cur.c===c)toggle();else{cur={r,c};if(!cellWord[r+','+c][dir])dir=dir==='A'?'D':'A'}draw();kb.focus()}}
  g.appendChild(e);cells[r][c]=e}}
for(const [dir2,id] of [['A','across'],['D','down']]){const ol=document.getElementById(id);
  for(const k in CLUES[dir2]){const li=document.createElement('li');li.id=dir2+k;li.innerHTML=`<b>${k}</b><span>${CLUES[dir2][k]}</span>`;
    li.onclick=()=>{dir=dir2;const[r,c]=words[dir2][k].find(([r,c])=>!val[r][c])||words[dir2][k][0];cur={r,c};draw();kb.focus()};ol.appendChild(li)}}
let cur=(([r,c])=>({r,c}))(words.A[Object.keys(words.A)[0]][0]),dir="A",t0=null,tick=null,done=false;
function toggle(){const o=dir==='A'?'D':'A';if(cellWord[cur.r+','+cur.c][o])dir=o}
function draw(){const wn=cellWord[cur.r+','+cur.c][dir],w=words[dir][wn];
  for(let r=0;r<N;r++)for(let c=0;c<M;c++){if(blk(r,c))continue;const e=cells[r][c];
    e.querySelector('.v').textContent=val[r][c];
    e.classList.toggle('word',w.some(([y,x])=>y===r&&x===c));e.classList.toggle('cur',r===cur.r&&c===cur.c)}
  document.querySelectorAll('.lists li').forEach(li=>{li.classList.toggle('on',li.id===dir+wn);
    const d=li.id[0],k=li.id.slice(1);li.classList.toggle('done',words[d][k].every(([r,c])=>val[r][c]))});
  document.getElementById('now').innerHTML=`<b>${wn}${dir}</b><span>${CLUES[dir][wn]}</span>`}
function startTimer(){if(t0||done)return;t0=Date.now();tick=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);document.getElementById('timer').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},250)}
function step(d){const w=words[dir][cellWord[cur.r+','+cur.c][dir]];const i=w.findIndex(([r,c])=>r===cur.r&&c===cur.c);const j=i+d;
  if(j>=0&&j<w.length){[cur.r,cur.c]=w[j];return true}return false}
function nextWord(){const list=[...Object.keys(words.A).map(k=>['A',+k]),...Object.keys(words.D).map(k=>['D',+k])];
  const i=list.findIndex(([d,k])=>d===dir&&k===cellWord[cur.r+','+cur.c][dir]);
  for(let s=1;s<=list.length;s++){const[d,k]=list[(i+s)%list.length];const e=words[d][k].find(([r,c])=>!val[r][c]);if(e){dir=d;[cur.r,cur.c]=e;return}}}
function type(ch){if(done)return;startTimer();val[cur.r][cur.c]=ch;cells[cur.r][cur.c].classList.remove('wrong','rev');
  const w=words[dir][cellWord[cur.r+','+cur.c][dir]];const i=w.findIndex(([r,c])=>r===cur.r&&c===cur.c);
  const rest=w.slice(i+1).find(([r,c])=>!val[r][c]);if(rest)[cur.r,cur.c]=rest;else if(w.every(([r,c])=>val[r][c]))nextWord();else step(1);
  draw();checkWin()}
function move(dr,dc){const want=dr?'D':'A';if(dir!==want&&cellWord[cur.r+','+cur.c][want]){dir=want;draw();return}
  let r=cur.r+dr,c=cur.c+dc;while(r>=0&&c>=0&&r<N&&c<M){if(!blk(r,c)){cur={r,c};if(!cellWord[r+','+c][dir])toggle();break}r+=dr;c+=dc}draw()}
kb.addEventListener('keydown',e=>{const k=e.key;
  if(/^[a-z]$/i.test(k)){e.preventDefault();type(k.toUpperCase())}
  else if(k==='Backspace'){e.preventDefault();if(done)return;if(!val[cur.r][cur.c])step(-1);val[cur.r][cur.c]='';draw()}
  else if(k==='ArrowRight'){e.preventDefault();move(0,1)}else if(k==='ArrowLeft'){e.preventDefault();move(0,-1)}
  else if(k==='ArrowDown'){e.preventDefault();move(1,0)}else if(k==='ArrowUp'){e.preventDefault();move(-1,0)}
  else if(k===' '){e.preventDefault();toggle();draw()}
  else if(k==='Tab'||k==='Enter'){e.preventDefault();nextWord();draw()}});
kb.addEventListener('input',()=>{const v=kb.value.replace(/[^a-z]/gi,'');kb.value='';if(v)type(v.slice(-1).toUpperCase())});
function checkWin(){for(let r=0;r<N;r++)for(let c=0;c<M;c++)if(!blk(r,c)&&val[r][c]!==SOL[r][c])return;
  done=true;clearInterval(tick);const w=document.getElementById('win');w.hidden=false;w.textContent=`Solved in ${document.getElementById('timer').textContent}. Veritas.`}
document.getElementById('check').onclick=()=>{for(let r=0;r<N;r++)for(let c=0;c<M;c++)if(!blk(r,c)&&val[r][c])cells[r][c].classList.toggle('wrong',val[r][c]!==SOL[r][c]);kb.focus()};
document.getElementById('reveal').onclick=()=>{for(let r=0;r<N;r++)for(let c=0;c<M;c++)if(!blk(r,c)&&val[r][c]!==SOL[r][c]){val[r][c]=SOL[r][c];cells[r][c].classList.remove('wrong');cells[r][c].classList.add('rev')}draw();checkWin()};
document.getElementById('reset').onclick=()=>{val=val.map(r=>r.map(()=>''));cells.flat().forEach(e=>e.classList.remove('wrong','rev'));clearInterval(tick);t0=null;done=false;
  document.getElementById('timer').textContent='0:00';document.getElementById('win').hidden=true;cur={r:words.A[Object.keys(words.A)[0]][0][0],c:words.A[Object.keys(words.A)[0]][0][1]};dir="A";draw();kb.focus()};
draw();
</script>

</body>
</html>
